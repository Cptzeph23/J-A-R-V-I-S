# Local hooks use the project's pinned tools from .venv (no third-party hook repos to pin).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --config backend/pyproject.toml
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --check --config backend/pyproject.toml
        language: system
        types: [python]
